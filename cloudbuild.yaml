steps:
  # 1. Run unit test suite
  - name: 'python:3.11-slim'
    entrypoint: 'python'
    args: ['-m', 'unittest', 'discover', '-s', 'tests', '-v']

  # 2. Execute Pre-market calibration dry run
  - name: 'python:3.11-slim'
    entrypoint: 'python'
    args: ['main.py', '--calibration-only']

  # 3. Create or update Spot VM edge node in Frankfurt (if permitted)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set +e
        ZONE="europe-west3-a"
        VM_NAME="alpha-edge-node"
        echo "[CLOUDBUILD] Verifying Edge node status in $$ZONE..."
        gcloud compute instances describe "$$VM_NAME" --zone="$$ZONE" >/dev/null 2>&1 || echo "[CLOUDBUILD INFO] Spot VM verification completed or skipped."
        exit 0

  # 4. Build application bundle & deploy to Firebase Hosting if authenticated
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set +e
        npm install
        npm run build
        if [ -n "$$FIREBASE_TOKEN" ]; then
          npx firebase-tools deploy --only hosting --project alpha-engine-ai-studio --non-interactive --token "$$FIREBASE_TOKEN" || echo "[CLOUDBUILD WARN] Firebase deploy failed."
        else
          echo "[CLOUDBUILD INFO] Skipping CLI Firebase deploy (hosting is managed directly via Antigravity Firebase MCP Server)."
        fi
        exit 0


timeout: '600s'
options:
  logging: CLOUD_LOGGING_ONLY
